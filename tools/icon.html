<!DOCTYPE html><html><head><meta charset="utf-8"><title>icon</title></head><body>
<!-- 아이콘 생성기: 로컬 서버를 띄우고 이 파일을 연 뒤
     콘솔에서 makeIcon(512,false) 를 호출해 나온 dataURL 을 PNG 로 저장하면 됩니다.
     (game/icons/*.png 를 이렇게 만들었습니다) -->
<script src="../game/js/breeds.js"></script><script src="../game/js/dog.js"></script><script>
function roundRect(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();}
window.makeIcon = function(size, maskable){
  var cv=document.createElement('canvas'); cv.width=cv.height=size;
  var c=cv.getContext('2d');
  var g=c.createLinearGradient(0,0,0,size);
  g.addColorStop(0,'#f6e3c8'); g.addColorStop(1,'#d9b184');
  c.fillStyle=g;
  if(maskable){ c.fillRect(0,0,size,size); } else { roundRect(c,0,0,size,size,size*0.22); c.fill(); }
  // 바닥 그림자
  c.fillStyle='rgba(120,86,50,0.18)';
  c.beginPath(); c.ellipse(size*0.5,size*0.86,size*0.3,size*0.05,0,0,Math.PI*2); c.fill();
  // 강아지 (시바 유년기 — 한눈에 강아지로 읽힌다)
  var pad = maskable ? size*0.2 : size*0.08;
  var dw = size - pad*2;
  var dog = Dog.portrait(BREEDS.breed('shiba'), BREEDS.stage(3), Math.round(dw*1.25), 'joy');
  c.drawImage(dog, size/2 - dw*1.25/2, size*0.97 - dw*1.25*0.96);
  return cv.toDataURL('image/png');
};
document.title='ready';
</script></body></html>
