<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<title>우리집 강아지 | 갓 태어난 강아지를 성견까지</title>
<meta name="description" content="진돗개·시바·골든리트리버 등 실제 견종을 갓 태어난 신생아부터 성견까지 키우는 육아 시뮬레이션. 예방접종, 산책, 훈련, 미용까지 진짜 강아지를 키우듯 돌봅니다.">
<meta name="theme-color" content="#7a5230">
<meta name="color-scheme" content="light">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="우리집 강아지">

<meta property="og:type" content="website">
<meta property="og:title" content="우리집 강아지 | 신생아부터 성견까지">
<meta property="og:description" content="실제 견종 9종을 갓 태어난 날부터 성견까지. 접종·산책·훈련·미용을 직접 챙기는 강아지 육아 게임.">
<meta property="og:locale" content="ko_KR">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="css/game.css">
</head>
<body>

<div id="app" class="app">

  <!-- ===== 시작 화면 ===== -->
  <section id="intro" class="screen intro" aria-label="시작">
    <div class="intro-inner">
      <p class="intro-eyebrow">갓 태어난 날부터 성견까지</p>
      <h1 class="intro-title">우리집 강아지</h1>
      <p class="intro-lead">실제 견종 9종. 눈도 못 뜬 신생아를 데려와<br>접종·산책·훈련을 거쳐 어른 개로 키웁니다.</p>

      <div class="intro-step">
        <h2 class="intro-h">1. 견종을 고르세요</h2>
        <div id="breed-picker" class="breed-picker" role="radiogroup" aria-label="견종 고르기"></div>
        <div id="breed-info" class="breed-info"></div>
      </div>

      <div class="intro-step">
        <h2 class="intro-h">2. 이름과 성별</h2>
        <input id="dog-name" class="text-input" type="text" maxlength="8" placeholder="예: 보리" autocomplete="off" aria-label="강아지 이름">
        <div class="sex-picker" role="radiogroup" aria-label="성별">
          <button type="button" class="sex-btn is-on" data-sex="f" role="radio" aria-checked="true">♀ 여자아이</button>
          <button type="button" class="sex-btn" data-sex="m" role="radio" aria-checked="false">♂ 남자아이</button>
        </div>
      </div>

      <div class="intro-step">
        <h2 class="intro-h">3. 난이도</h2>
        <div class="mode-picker" role="radiogroup" aria-label="난이도">
          <button type="button" class="mode-btn is-on" data-mode="easy" role="radio" aria-checked="true">
            <strong>순한맛</strong><span>무슨 일이 있어도 이별하지 않아요. 저학년 추천</span>
          </button>
          <button type="button" class="mode-btn" data-mode="hard" role="radio" aria-checked="false">
            <strong>매운맛</strong><span>오래 방치하면 무지개다리를 건널 수 있어요</span>
          </button>
        </div>
      </div>

      <button id="btn-start" class="btn btn-primary btn-big" type="button">강아지 데려오기</button>
      <p class="intro-foot">기록은 이 기기에만 저장됩니다. 홈 화면에 추가하면 앱처럼 열려요.</p>
    </div>
  </section>

  <!-- ===== 게임 본화면 ===== -->
  <main id="game" class="screen game" hidden>
    <header class="hud">
      <div class="hud-pet">
        <strong id="hud-name" class="hud-name">강아지</strong>
        <span id="hud-meta" class="hud-meta">신생아</span>
      </div>
      <div class="hud-right">
        <span class="coin" id="hud-coins" aria-label="코인"><i class="coin-dot" aria-hidden="true"></i><b>0</b></span>
        <button class="icon-btn" type="button" data-open="menu" aria-label="메뉴">≡</button>
      </div>
    </header>

    <div class="stage" id="stage">
      <div class="stage-sky" id="stage-sky" aria-hidden="true"></div>
      <div class="speech" id="speech" role="status" aria-live="polite" hidden></div>
      <button class="dog-btn" id="dog-btn" type="button" aria-label="쓰다듬기">
        <canvas id="dog-canvas" class="dog-canvas" width="512" height="512" aria-label="강아지"></canvas>
      </button>
      <div class="dog-shadow" id="dog-shadow" aria-hidden="true"></div>
      <div class="poops" id="poops" aria-label="치울 것"></div>
      <div class="fx" id="fx" aria-hidden="true"></div>
      <div class="stage-floor" aria-hidden="true"></div>
      <div class="badges" id="badges" aria-hidden="true"></div>
    </div>

    <section class="gauges" aria-label="상태">
      <div class="gauge" data-key="fill"><span class="g-ico" aria-hidden="true">🍚</span><span class="g-name">포만감</span><div class="g-bar"><i></i></div></div>
      <div class="gauge" data-key="mood"><span class="g-ico" aria-hidden="true">💗</span><span class="g-name">기분</span><div class="g-bar"><i></i></div></div>
      <div class="gauge" data-key="clean"><span class="g-ico" aria-hidden="true">🫧</span><span class="g-name">청결</span><div class="g-bar"><i></i></div></div>
      <div class="gauge" data-key="energy"><span class="g-ico" aria-hidden="true">⚡</span><span class="g-name">체력</span><div class="g-bar"><i></i></div></div>
      <div class="gauge gauge-wide" data-key="exp"><span class="g-ico" aria-hidden="true">🌱</span><span class="g-name" id="exp-label">성장</span><div class="g-bar g-exp"><i></i></div></div>
    </section>

    <nav class="dock dock-2row" aria-label="돌보기">
      <button class="act" type="button" data-act="feed"><span aria-hidden="true">🍚</span>밥주기</button>
      <button class="act" type="button" data-act="walk"><span aria-hidden="true">🦮</span>산책</button>
      <button class="act" type="button" data-act="play"><span aria-hidden="true">🎾</span>놀아주기</button>
      <button class="act" type="button" data-act="groom"><span aria-hidden="true">🪮</span>빗질</button>
      <button class="act" type="button" data-act="train"><span aria-hidden="true">🎓</span>훈련</button>
      <button class="act" type="button" data-act="clinic"><span aria-hidden="true">🏥</span>병원</button>
      <button class="act" type="button" data-act="shop"><span aria-hidden="true">🛒</span>상점</button>
      <button class="act" type="button" data-act="book"><span aria-hidden="true">📔</span>수첩</button>
    </nav>
  </main>

  <div id="modal-root" class="modal-root" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
</div>

<script src="js/breeds.js"></script>
<script src="js/dog.js"></script>
<script src="js/data.js"></script>
<script src="js/sound.js"></script>
<script src="js/state.js"></script>
<script src="js/minigames.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
</html>
